<!doctype html>
<html lang="ka" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			(function () {
				try {
					var qs = new URLSearchParams(location.search);
					var t = qs.get('theme') || localStorage.getItem('xokaido-theme');
					if (t !== 'light' && t !== 'dark') {
						t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
					}
					document.documentElement.dataset.theme = t;
					var l = qs.get('lang') || localStorage.getItem('xokaido-lang');
					if (l === 'ka' || l === 'ru' || l === 'en') document.documentElement.lang = l;
				} catch (e) {}
			})();
		</script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&family=Playfair+Display:ital,wght@0,500..700;1,500..700&family=Noto+Serif+Georgian:wght@400..700&family=Inter:wght@400..700&family=Noto+Sans+Georgian:wght@400..700&display=swap"
			rel="stylesheet"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
