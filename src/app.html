<!doctype html>
<html lang="ka" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			(function () {
				try {
					var qs = new URLSearchParams(location.search);
					var t = qs.get('theme') || localStorage.getItem('xokaido-theme');
					// Dark unless the visitor has chosen light
					if (t !== 'light' && t !== 'dark') t = 'dark';
					document.documentElement.dataset.theme = t;
					var l = qs.get('lang') || localStorage.getItem('xokaido-lang');
					if (l === 'ka' || l === 'ru' || l === 'en') document.documentElement.lang = l;
				} catch (e) {}
			})();
		</script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Geist:wght@400..600&family=Source+Serif+4:opsz,wght@8..60,400..600&family=JetBrains+Mono:wght@400..500&family=Noto+Sans+Georgian:wght@400..600&family=Noto+Serif+Georgian:wght@400..600&display=swap"
			rel="stylesheet"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
